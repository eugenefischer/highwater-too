name: CI

# To save Actions minutes (macOS minutes count several times Linux's against the monthly allowance):
# every push runs on Ubuntu only; macOS runs once a week and whenever started by hand (Actions →
# CI → Run workflow). A push that changes only Markdown (READMEs, the CHANGELOG) runs nothing, and
# a newer push cancels a run still going for an older one.
on:
  push:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install poppler (pixel comparison)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y poppler-utils; else brew install poppler; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests in VS Code
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:e2e -w highwater-too; else npm run test:e2e -w highwater-too; fi
